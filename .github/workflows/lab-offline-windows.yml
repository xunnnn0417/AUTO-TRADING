name: LAB Windows tests and portable release

on:
  push:
    branches:
      - lab/2026-10-16-safe-defaults-preflight
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: lab-windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout LAB source only
        uses: actions/checkout@v4
      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-portable.txt
            requirements-build.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile complete LAB code
        run: python -m compileall -q main.py trading_helper tests
      - name: Run all isolated offline unit tests (NO BROKERS)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify no generated differences
        run: git diff --exit-code
      - name: Identify the tested dependency environment
        id: portable
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/2026-10-16-safe-defaults-preflight'
        shell: pwsh
        run: |
          $key = python scripts/build_portable.py --cache-key
          if ($LASTEXITCODE -ne 0) { throw "無法確認打包環境。" }
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Reuse portable Python and dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/2026-10-16-safe-defaults-preflight'
        uses: actions/cache@v4
        with:
          path: .portable-runtime
          key: portable-windows-x64-${{ steps.portable.outputs.key }}
      - name: Build and verify clean Windows portable package
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/2026-10-16-safe-defaults-preflight'
        run: python scripts/build_portable.py
      - name: Save downloadable build files
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/2026-10-16-safe-defaults-preflight'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-portable-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/release-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish LAB download
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/2026-10-16-safe-defaults-preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $info = Get-Content dist/release-info.json -Raw | ConvertFrom-Json
          $existing = gh release view $info.tag --repo "$env:GITHUB_REPOSITORY" --json assets,targetCommitish,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            $required = @($info.asset, "$($info.asset).sha256", "release-info.json")
            $missing = $required | Where-Object { $_ -notin $release.assets.name }
            if ($release.isDraft -or $release.targetCommitish -ne "$env:GITHUB_SHA" -or $missing) { throw "同名版本資料不完整，已停止發布並保留現有檔案。" }
            Write-Host "This commit already has a complete download package."
            exit 0
          }
          gh release create $info.tag "dist/$($info.asset)" "dist/$($info.asset).sha256" "dist/release-info.json" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Windows 免安裝版 $($info.version)" --notes-file dist/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "下載包發布失敗；建置檔案仍可從本次 Actions 下載。" }
