name: LAB Windows offline safety regression

on:
  push:
    branches:
      - lab/2026-10-16-safe-defaults-preflight
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: lab-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout LAB source only
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile complete LAB code
        run: python -m compileall -q main.py trading_helper tests
      - name: Run all isolated offline unit tests (NO BROKERS)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify no generated differences
        run: git diff --exit-code
